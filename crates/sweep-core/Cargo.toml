[package]
name = "sweep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClearSweep core library: pure logic, no UI or transport dependencies"

[features]
# Test helpers (fixture builder) for downstream crates' tests and the e2e build.
testutil = ["dep:filetime"]

[dependencies]
dirs = "7.0.0"
filetime = { version = "0.2", optional = true }
globset = "0.4"
rand = "0.10"
rayon = "1.12.0"
rusqlite = { version = "0.40", features = ["functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
thiserror = "2.0.21"
time = { version = "0.3", features = ["formatting"] }
toml = "1.1"
walkdir = "2.5"

# Bundle SQLite everywhere except macOS, where the system libsqlite3 is used (the
# bundled C build cannot be cross-checked without an Apple toolchain).
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40", features = ["functions", "bundled"] }
blake3 = "1.8.7"

# BLAKE3 (duplicate finder). On macOS the pure-Rust build is used, like SQLite above: the
# NEON assembly path needs Apple's C toolchain, which the cross-check in scripts/check.sh
# does not have. Other platforms keep the SIMD implementations.
[target.'cfg(target_os = "macos")'.dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# File identity (hard-link detection) and free-space queries for the disk tools.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3.27.0"
