db = "{firefox_profile}/formhistory.sqlite"
statements = [
  "DELETE FROM moz_formhistory",
]
countQuery = "SELECT COUNT(*) FROM moz_formhistory"

[[rule]]
id = "firefox.passwords"
name = "Saved Passwords"
group = "Mozilla Firefox"
category = "browser"
os = ["linux", "windows", "macos"]
defaultEnabled = false
description = "Logins that Firefox saved for websites (logins.json and its encryption key)."
warning = "This permanently deletes every password saved in the browser. Make sure you can recover them (Firefox Sync, password manager) before enabling."
processes = { linux = ["firefox", "firefox-bin", "firefox-esr"], windows = ["firefox.exe"], macos = ["firefox"] }

[[rule.targets]]
kind = "file"
path = "{firefox_profile}/{logins.json,logins-backup.json,key4.db,key3.db,signons.sqlite}"
