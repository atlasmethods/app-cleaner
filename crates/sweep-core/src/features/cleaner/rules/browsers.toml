[[rule]]
id = "chrome.history"
name = "Internet History"
group = "Google Chrome"
category = "browser"
os = ["linux", "windows", "macos"]
defaultEnabled = true
description = "Browsing history (visited pages, searches) of Google Chrome. Download history and bookmarks are kept."
processes = { linux = ["chrome", "google-chrome"], windows = ["chrome.exe"], macos = ["Google Chrome"] }

[[rule.targets]]
kind = "sqlite"
os = ["linux"]
db = "{config}/google-chrome/*/History"
statements = [
  "DELETE FROM visit_source",
  "DELETE FROM segment_usage",
  "DELETE FROM segments",
  "DELETE FROM keyword_search_terms",
  "DELETE FROM content_annotations",
  "DELETE FROM context_annotations",
  "DELETE FROM cluster_keywords",
  "DELETE FROM cluster_visit_duplicates",
  "DELETE FROM clusters_and_visits",
  "DELETE FROM clusters",
  "DELETE FROM visits",
  "DELETE FROM urls",
]
countQuery = "SELECT (SELECT COUNT(*) FROM urls) + (SELECT COUNT(*) FROM visits)"

[[rule.targets]]
kind = "sqlite"
os = ["linux"]
db = "{home}/.var/app/com.google.Chrome/config/google-chrome/*/History"
statements = [
  "DELETE FROM visit_source",
  "DELETE FROM segment_usage",
  "DELETE FROM segments",
  "DELETE FROM keyword_search_terms",
  "DELETE FROM content_annotations",
  "DELETE FROM context_annotations",
  "DELETE FROM cluster_keywords",
  "DELETE FROM cluster_visit_duplicates",
  "DELETE FROM clusters_and_visits",
  "DELETE FROM clusters",
  "DELETE FROM visits",
  "DELETE FROM urls",
]
countQuery = "SELECT (SELECT COUNT(*) FROM urls) + (SELECT COUNT(*) FROM visits)"

[[rule.targets]]
kind = "sqlite"
os = ["windows"]
db = "{localappdata}/Google/Chrome/User Data/*/History"
statements = [
  "DELETE FROM visit_source",
  "DELETE FROM segment_usage",
  "DELETE FROM segments",
  "DELETE FROM keyword_search_terms",
  "DELETE FROM content_annotations",
  "DELETE FROM context_annotations",
  "DELETE FROM cluster_keywords",
  "DELETE FROM cluster_visit_duplicates",
  "DELETE FROM clusters_and_visits",
  "DELETE FROM clusters",
  "DELETE FROM visits",
  "DELETE FROM urls",
]
countQuery = "SELECT (SELECT COUNT(*) FROM urls) + (SELECT COUNT(*) FROM visits)"

[[rule.targets]]
kind = "sqlite"
os = ["macos"]
db = "{config}/Google/Chrome/*/History"
statements = [
  "DELETE FROM visit_source",
  "DELETE FROM segment_usage",
  "DELETE FROM segments",
  "DELETE FROM keyword_search_terms",
  "DELETE FROM content_annotations",
  "DELETE FROM context_annotations",
  "DELETE FROM cluster_keywords",
  "DELETE FROM cluster_visit_duplicates",
  "DELETE FROM clusters_and_visits",
  "DELETE FROM clusters",
  "DELETE FROM visits",
  "DELETE FROM urls",
]
countQuery = "SELECT (SELECT COUNT(*) FROM urls) + (SELECT COUNT(*) FROM visits)"

