# Browser rules. Chromium-family browsers (Chrome, Chromium, Edge, Brave, Opera, Vivaldi)
# share one layout; Firefox profiles are found through `{firefox_profile}`.
# See README.md for the schema.

[[rule]]
id = "chrome.cache"
name = "Internet Cache"
group = "Google Chrome"
category = "browser"
os = ["linux", "windows", "macos"]
defaultEnabled = true
description = "Cached web pages, scripts and images stored by Google Chrome. Rebuilt automatically as you browse."
processes = { linux = ["chrome", "google-chrome"], windows = ["chrome.exe"], macos = ["Google Chrome"] }

[[rule.targets]]
kind = "files"
os = ["linux"]
base = "{config}/google-chrome/*/Cache"
recursive = true
removeEmptyDirs = true

