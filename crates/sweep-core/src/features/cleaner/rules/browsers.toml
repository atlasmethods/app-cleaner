[[rule]]
id = "chrome.session"
name = "Session"
group = "Google Chrome"
category = "browser"
os = ["linux", "windows", "macos"]
defaultEnabled = false
description = "The tabs Google Chrome restores after a restart or crash."
warning = "Removes the open-tabs snapshot: tabs from your last session cannot be restored afterwards."
processes = { linux = ["chrome", "google-chrome"], windows = ["chrome.exe"], macos = ["Google Chrome"] }

[[rule.targets]]
kind = "files"
os = ["linux"]
base = "{config}/google-chrome/*/Sessions"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "file"
os = ["linux"]
path = "{config}/google-chrome/*/{Current,Last} {Session,Tabs}"

[[rule.targets]]
kind = "files"
os = ["linux"]
base = "{home}/.var/app/com.google.Chrome/config/google-chrome/*/Sessions"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "file"
os = ["linux"]
path = "{home}/.var/app/com.google.Chrome/config/google-chrome/*/{Current,Last} {Session,Tabs}"

[[rule.targets]]
kind = "files"
os = ["windows"]
base = "{localappdata}/Google/Chrome/User Data/*/Sessions"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "file"
os = ["windows"]
path = "{localappdata}/Google/Chrome/User Data/*/{Current,Last} {Session,Tabs}"

[[rule.targets]]
kind = "files"
os = ["macos"]
base = "{config}/Google/Chrome/*/Sessions"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "file"
os = ["macos"]
path = "{config}/Google/Chrome/*/{Current,Last} {Session,Tabs}"

