# Application rules (chat clients, editors, media apps, developer tool caches).

[[rule]]
id = "vscode.cache"
name = "Cache"
group = "Visual Studio Code"
category = "application"
os = ["linux", "windows", "macos"]
defaultEnabled = true
description = "Cached data of VS Code. Rebuilt on next start."
processes = { linux = ["code"], windows = ["Code.exe"] }

[[rule.targets]]
kind = "files"
os = ["linux", "macos"]
base = "{config}/Code/{Cache,Code Cache,GPUCache,CachedData}"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "files"
os = ["windows"]
base = "{appdata}/Code/{Cache,Code Cache,GPUCache,CachedData}"
recursive = true
removeEmptyDirs = true

[[rule]]
id = "vscode.logs"
name = "Logs"
group = "Visual Studio Code"
category = "application"
os = ["linux", "windows", "macos"]
defaultEnabled = true
description = "Log files written by VS Code."
processes = { linux = ["code"], windows = ["Code.exe"] }

[[rule.targets]]
kind = "files"
os = ["linux", "macos"]
base = "{config}/Code/logs"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "files"
os = ["windows"]
base = "{appdata}/Code/logs"
recursive = true
removeEmptyDirs = true

