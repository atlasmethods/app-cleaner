[[rule]]
id = "libreoffice.backups"
name = "Document Backups"
group = "LibreOffice"
category = "application"
os = ["linux", "windows", "macos"]
defaultEnabled = false
description = "Automatic backup copies of documents you were editing."
warning = "These are recovery copies. Only clean them when you are sure none of your documents needs recovering."
processes = { linux = ["soffice.bin"], windows = ["soffice.exe", "soffice.bin"], macos = ["soffice"] }

[[rule.targets]]
kind = "files"
os = ["linux"]
base = "{config}/libreoffice/*/user/backup"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "files"
os = ["windows"]
base = "{appdata}/LibreOffice/*/user/backup"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "files"
os = ["macos"]
base = "{config}/LibreOffice/*/user/backup"
recursive = true
removeEmptyDirs = true

