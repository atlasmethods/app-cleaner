group = "Cargo"
category = "application"
os = ["linux", "windows", "macos"]
defaultEnabled = false
description = "Downloaded crate archives and unpacked sources."
warning = "Cargo downloads and unpacks crates again on the next build, which needs a network connection."

[[rule.targets]]
kind = "files"
base = "{home}/.cargo/registry/cache"
recursive = true
removeEmptyDirs = true

[[rule.targets]]
kind = "files"
base = "{home}/.cargo/registry/src"
recursive = true
removeEmptyDirs = true
