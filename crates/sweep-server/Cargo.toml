[package]
name = "sweep-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClearSweep local HTTP server (browser mode)"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
sweep-core = { version = "0.1.0", path = "../sweep-core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = "0.1.19"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tempfile = "3.27.0"
