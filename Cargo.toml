[workspace]
resolver = "2"
members = ["crates/sweep-core", "crates/sweep-server", "crates/sweep-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ClearSweep contributors"]
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
